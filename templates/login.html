{% extends "base.html" %}

{% block title %}
Login - Attendance Management System
{% endblock %}

{% block content %}

<div class="login-container">

    <h1>Student Attendance System</h1>

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

</div>

{% endblock %}
