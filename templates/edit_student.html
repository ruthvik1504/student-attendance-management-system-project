{% extends "base.html" %}

{% block title %}
Edit Student - Attendance Management System
{% endblock %}

{% block content %}

<h1>Edit Student</h1>

<form method="POST">

    <label for="roll_no">
        Roll Number
    </label>

    <input
        type="text"
        id="roll_no"
        name="roll_no"
        value="{{ student['roll_no'] }}"
        required
    >

    <label for="name">
        Student Name
    </label>

    <input
        type="text"
        id="name"
        name="name"
        value="{{ student['name'] }}"
        required
    >

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        value="{{ student['email'] }}"
    >

    <label for="course">
        Course
    </label>

    <input
        type="text"
        id="course"
        name="course"
        value="{{ student['course'] }}"
    >

    <label for="branch">
        Branch
    </label>

    <input
        type="text"
        id="branch"
        name="branch"
        value="{{ student['branch'] }}"
    >

    <button type="submit">
        Update Student
    </button>

</form>

{% endblock %}
