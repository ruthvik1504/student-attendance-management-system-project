{% extends "base.html" %}

{% block title %}
Add Student - Attendance Management System
{% endblock %}

{% block content %}

<h1>Add Student</h1>

<form method="POST">

    <label for="roll_no">
        Roll Number
    </label>

{% if error %}

    <p class="error">
        {{ error }}
    </p>

{% endif %}

    <input
        type="text"
        id="roll_no"
        name="roll_no"
        placeholder="Enter roll number"
        required
    >

    <label for="name">
        Student Name
    </label>

    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter student name"
        required
    >

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter email"
    >

    <label for="course">
        Course
    </label>

    <input
        type="text"
        id="course"
        name="course"
        placeholder="e.g. B.Tech"
    >

    <label for="branch">
        Branch
    </label>

    <input
        type="text"
        id="branch"
        name="branch"
        placeholder="e.g. ECE"
    >

    <button type="submit">
        Add Student
    </button>

</form>

{% endblock %}
